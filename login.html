<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 영국 마법부 포털</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <a class="logo" href="index.html">← 포털 홈으로</a>
      <h1>로그인</h1>
      <p>이미 등록된 마법사와 마녀를 위한 로그인 페이지입니다.</p>
    </div>
  </header>

  <main class="container narrow">
    <form class="form-card" action="#" method="post">
      <label for="login-id">아이디</label>
      <input id="login-id" type="text" name="id" placeholder="마법부 아이디" required>

      <label for="login-password">비밀번호</label>
      <input id="login-password" type="password" name="password" placeholder="비밀번호" required>

      <button type="submit" class="button primary">로그인</button>
      <p class="form-note">계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2024 영국 마법부. 마법부 정보 보안국에 의해 보호됩니다.</p>
    </div>
  </footer>
</body>
</html>
