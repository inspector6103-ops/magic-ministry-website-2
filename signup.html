<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 영국 마법부 포털</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="container">
      <a class="logo" href="index.html">← 포털 홈으로</a>
      <h1>회원가입</h1>
      <p>마법부 포털 이용을 위한 신규 등록 페이지입니다.</p>
    </div>
  </header>

  <main class="container narrow">
    <form class="form-card" id="signup-form">
      <label for="signup-id">아이디</label>
      <input id="signup-id" type="text" name="id" placeholder="사용할 아이디" required>

      <label for="signup-password">비밀번호</label>
      <input id="signup-password" type="password" name="password" placeholder="비밀번호" required>

      <button type="submit" class="button primary">가입하기</button>
      <p class="success-message" id="signup-success" aria-live="polite" hidden>환영합니다! 회원가입되었습니다!</p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2024 영국 마법부. 마법부 정보 보안국에 의해 보호됩니다.</p>
    </div>
  </footer>

  <script>
    const form = document.getElementById('signup-form');
    const successMessage = document.getElementById('signup-success');

    form.addEventListener('submit', event => {
      event.preventDefault();
      successMessage.hidden = false;
      form.reset();
    });
  </script>
</body>
</html>
